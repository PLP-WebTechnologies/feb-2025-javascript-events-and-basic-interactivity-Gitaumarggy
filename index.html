<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Playground</title>
    <link rel="stylesheet" href="style.css">
  

</head>
<body>
    <header>
        <h1>Welcome to My Interactive Page</h1>
    </header>

    <main>
        <!-- Event Handling Section -->
        <section id="event-handling">
            <h2>Event Handling</h2>
            
            <div class="event-box">
                <button id="click-btn" class="interactive-btn">Click Me!</button>
                <p id="click-message" class="hidden">🎉welcome to my page !</p>
            </div>
            
            
            <div class="event-box hover-box">
                <p id="hover-output">Hover over this box!</p>
            </div>
            
            <div class="event-box">
                <input type="text" id="keypress-input" placeholder="Type something...">
            
            </div>
            
            <div class="event-box secret-box">
                <p>Double click or long press for a secret!</p>
                <p id="secret-output" class="hidden">hello world , i am a web developer .</p>
            </div>
        </section>

        <!-- Interactive Elements Section -->
        <section id="interactive-elements">
            <h2>Interactive Elements</h2>
            
            <div class="color-changer">
                <button id="color-btn">Change Color</button>
                <div id="color-display" class="color-box"></div>
            </div>
            
            <div class="gallery">
                <h3>Image Gallery</h3>
                <div class="gallery-container">
                    <img src="IMG_1611.jpg" alt="Gallery image" class="gallery-img active">
                    <img src="IMG_1636.jpg" alt="Gallery image" class="gallery-img">
                    <img src="IMG_1611.jpg" alt="Gallery image" class="gallery-img">
                </div>
                <div class="gallery-controls">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
            </div>
            
            <div class="tabs">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="tab1">Tab 1</button>
                    <button class="tab-btn" data-tab="tab2">Tab 2</button>
                    <button class="tab-btn" data-tab="tab3">Tab 3</button>
                </div>
                <div class="tab-content">
                    <div id="tab1" class="tab-pane active">
                        <p>content for Tab 1</p>
                    </div>
                    <div id="tab2" class="tab-pane">
                        <p>Content for Tab 2</p>
                    </div>
                    <div id="tab3" class="tab-pane">
                        <p>Content for Tab 3</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Form Validation Section -->
        <section id="form-validation">
            <h2>Form Validation</h2>
            <form id="user-form">
                <div class="form-group">
                    <label for="name">Name (required)</label>
                    <input type="text" id="name" name="name">
                    <div class="error-message" id="name-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email (required)</label>
                    <input type="email" id="email" name="email">
                    <div class="error-message" id="email-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password (min 8 characters)</label>
                    <input type="password" id="password" name="password">
                    <div class="error-message" id="password-error"></div>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text"></span>
                    </div>
                </div>
                
                <button type="submit" id="submit-btn">Submit</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
